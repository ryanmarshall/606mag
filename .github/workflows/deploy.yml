# Builds the modern site (web/), adds the cleaned original under /archive (site/),
# makes every link page-relative so it works at ryanmarshall.github.io/606mag/ and at
# 606mag.com/, checks every internal link and image, and publishes to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the modern site
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Add the original-site archive
        run: |
          rm -rf web/dist/archive
          cp -R site web/dist/archive
      - name: Make links page-relative
        run: python3 tools/relativize_dist.py web/dist
      - name: Check every internal link and image
        run: python3 tools/check_site_links.py web/dist --relative
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only the deploy job (no third-party build code) may publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
